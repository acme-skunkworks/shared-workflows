name: Reusable / Claude Code Review

# Reusable (workflow_call) version of the estate's PR-review workflow. The
# `pull_request` trigger — and its `paths-ignore` for the claude workflow files
# — stay in the CALLER stub (paths filters are only valid on real triggers, not
# on workflow_call). See the caller stub in this repo's `claude-code-review.yml`
# and the README for the consumer snippet.
#
# REQUIRED CALLER PERMISSIONS (A-621): a called reusable workflow's job cannot be
# granted more than the caller's GITHUB_TOKEN holds. Under the org default
# `default_workflow_permissions: read`, a caller with no `permissions:` block
# hands this workflow a read-only token, the `claude-review` job below can't get
# the `pull-requests: write` / `id-token: write` it needs, and the run dies at
# compile time with a `startup_failure` — no jobs, no logs, and the REST API hides
# the reason (read the one-line error on the Actions UI run page). This is the
# most common cause of 'Claude review never posts' across consumers. So the caller
# MUST declare every scope this job needs.
#
# Consume from another repo (floating major tag `@v1` — see README):
#
#   permissions:
#     contents: read
#     pull-requests: write # Post the review comment
#     issues: read
#     actions: read # Install claude-code-action's github_ci MCP server (A-1105)
#     id-token: write # OIDC token exchange (getOidcToken) — required, not optional
#   jobs:
#     claude-review:
#       uses: acme-skunkworks/shared-workflows/.github/workflows/reusable-claude-code-review.yml@v1
#       # Requires CLAUDE_CODE_OAUTH_TOKEN in THIS repo's Actions secrets — NOT
#       # ANTHROPIC_API_KEY (an empty ANTHROPIC_API_KEY in the log is a red herring).
#       secrets: inherit

on:
  workflow_call:
    inputs:
      timeout_minutes:
        description: Job timeout in minutes.
        type: number
        required: false
        default: 30
      track_progress:
        description: Show a live progress checklist on the PR.
        type: boolean
        required: false
        default: true
      use_sticky_comment:
        description: Reuse a single sticky comment instead of posting a new one each run.
        type: boolean
        required: false
        default: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token for claude-code-action.
        required: true

# NB: NO top-level `concurrency:` here. A called reusable workflow runs as the
# caller's job, so a workflow-level concurrency group in this reusable resolves
# to the SAME value as the identical group the caller sets in its own top-level
# `concurrency:` — GitHub then detects the workflow deadlocking against its own
# called job and cancels the run at startup ("a deadlock was detected for
# concurrency group '<workflow>-<pr#>' between a top level workflow and
# 'claude-review'"). That broke the review for every caller (A-621). Concurrency
# belongs in the CALLER, where the `pull_request` trigger lives; the caller stub
# already declares it, so this reusable must not.

jobs:
  claude-review:
    # Dependabot PRs are skipped (A-646): a Dependabot-triggered run reads the
    # Dependabot secret store, not Actions secrets, so CLAUDE_CODE_OAUTH_TOKEN is
    # empty by design and the review can't authenticate — skip cleanly (neutral)
    # rather than conclude failure. Draft and release-please branches skip too.
    #
    # The `skip-review` label spares Claude on the release-orchestrator's
    # unattended automation PRs — fan-out rollouts and changelog-enrichment PRs
    # (A-716). These auto-merge and carry no new behaviour, so reviewing them only
    # burns quota. This brings Claude into parity with CodeRabbit, which already
    # honours the same label via the canonical `.coderabbit.yaml`'s
    # `labels: ["!skip-review"]` denylist. It fails safe — a forgotten label means
    # more review, not less.
    if: >-
      github.event.pull_request.draft == false &&
      !startsWith(github.head_ref, 'release-please--') &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      # claude-code-action offers Claude a `github_ci` MCP server (get_ci_status,
      # get_workflow_run_details, download_job_log) and keeps those tools in
      # --allowedTools unconditionally. Without `actions: read` the action logs
      # "The github_ci MCP server requires 'actions: read' permission. Skipping CI
      # server installation." and Claude is left holding tool names backed by no
      # server. Granting the scope installs it, so a review can read the PR's CI
      # status instead of guessing (A-1105). Read-only, and the narrowest scope
      # that satisfies the action's own check.
      #
      # NB: a called reusable workflow's job cannot hold more than the CALLER's
      # token grants (see A-621 above), so the caller stub must declare
      # `actions: read` too — this line alone is not enough.
      actions: read
      # Required: claude-code-action exchanges an OIDC token for its short-lived
      # GitHub token (getOidcToken → setupGitHubToken). Removing it fails the run
      # with "Could not fetch an OIDC token" — it is NOT just for publishing, so
      # the A-329 least-privilege drop was reverted.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full fetch (all branches/tags), not a depth-1 clone of the PR merge
          # ref: with track_progress on, claude-code-action runs an internal
          # `git fetch origin --depth=20 <head-branch>` and needs the branch
          # history available (A-636). (Cost: full history — negligible here.)
          fetch-depth: 0
          # Checkout deliberately does NOT persist the default token in
          # .git/config (artipacked hardening). That alone breaks the internal
          # fetch below, so the next step re-adds a read-scoped credential just
          # for it (A-674).
          persist-credentials: false

      - name: Authenticate git for claude-code-action's internal fetch (A-674)
        # claude-code-action's internal `git fetch origin --depth=20 <head-branch>`
        # (track_progress) uses the ambient git credential, which the checkout
        # above did not persist — so it dies with
        # `fatal: could not read Username for 'https://github.com'` AFTER OIDC
        # succeeds, and no review posts. A-636's fetch-depth: 0 did NOT fix this:
        # the fetch fails on auth, before depth is ever consulted. Re-add just the
        # job's read-scoped GITHUB_TOKEN (contents: read) as a github.com fetch
        # credential — equivalent to persist-credentials: true for the default
        # token, but written explicitly so the purpose and read-only scope are
        # documented and the re-add is a deliberate, minimal exception to the
        # artipacked hardening above (not an accident).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config \
            "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

      - name: 🚦 Guard — CLAUDE_CODE_OAUTH_TOKEN is set
        # A-646: `required: true` on a workflow_call secret only forces the caller
        # to MAP the secret (e.g. `secrets: inherit`) — it does NOT guarantee a
        # non-empty VALUE. A consumer inheriting from a repo where the secret is
        # unset passes an empty string that satisfies the schema, then
        # claude-code-action dies deep in its OIDC/token exchange with an opaque
        # error and no review posts. Fail fast here with a clear message. `secrets`
        # isn't available in a step `if:`, so map it into `env:` and test the shell.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty. Define it as a repository Actions secret in the consuming repo (it is NOT ANTHROPIC_API_KEY, and there is no org-level secret) and pass 'secrets: inherit' from the caller (A-646)."
            exit 1
          fi
          echo "OK — CLAUDE_CODE_OAUTH_TOKEN is present."

      - name: Run Claude Code Review
        id: claude-review
        # If startup crashes with an AJV schema error, see anthropics/claude-code-action#947
        # and pin to a known-good version (e.g. v1.0.51).
        uses: anthropics/claude-code-action@9db594c7a0e82298c121c18b7f08aa1579ce7341 # v1.0.185
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # NB: this action version has NO marketplace ref-pin mechanism.
          # base-action/src/install-plugins.ts validates the input against
          # /^https:\/\/…\.git$/ — it MUST end in `.git` — then passes it
          # verbatim to `claude plugin marketplace add`. A `#tag`/`@ref` suffix
          # fails the regex ("Invalid marketplace URL format") and a bare URL
          # always clones the marketplace at default-branch HEAD. So the
          # immutable-tag pin is impossible here and the marketplace necessarily
          # floats (A-343). Accepted risk: the marketplace repo is the same
          # first-party org (anthropics) as the SHA-pinned action above, and the
          # review is already hardened — WebSearch/WebFetch disallowed, tight
          # --allowedTools, no publish identity. Do NOT re-add a `#tag` suffix:
          # it re-breaks the job.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          allowed_bots: "road-runner-bot[bot],cursor[bot]"
          track_progress: ${{ inputs.track_progress }}
          use_sticky_comment: ${{ inputs.use_sticky_comment }}
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

      - name: 🔎 Surface the Claude failure (A-1105)
        # The step above runs the SDK with `show_full_output: false` (the secure
        # default) and prints only "Running Claude Code via SDK (full output
        # hidden for security)…". When the SDK errors, ALL a maintainer sees is
        # the annotation `Claude execution failed: result is_error:true` — the
        # actual message is written to the execution log and then never read
        # back. On release-orchestrator that turned an expired
        # CLAUDE_CODE_OAUTH_TOKEN into an 8-day silent outage that was
        # misdiagnosed twice, because the only visible artefact was an unrelated
        # zero-byte `curl` body from the action's POST-JOB token revocation
        # (`DELETE /installation/token` — a red herring; an empty body is the
        # CORRECT response there, and it is logged after the job has failed).
        #
        # So: on failure, pull the named result fields back out. Deliberately
        # NOT `show_full_output: true` and NOT a dump of the file — the log also
        # holds the prompt and the PR diff. Only the result record's scalar
        # fields plus its `result`/`error` message are echoed, truncated, which
        # is enough to tell an auth rejection from a crash from a real review
        # failure while keeping the action's security default intact.
        #
        # The tell for a credential rejection is `num_turns: 1` with
        # `total_cost_usd: 0` — it died at or before the first billable call.
        if: failure() && steps.claude-review.conclusion == 'failure'
        env:
          # Prefer the action's own output; fall back to the documented default
          # path in case a crash left the output unset.
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -uo pipefail
          file="${EXECUTION_FILE:-}"
          [ -n "$file" ] || file="${RUNNER_TEMP}/claude-execution-output.json"

          if [ ! -f "$file" ]; then
            echo "::warning::No Claude execution log at '${file}' — the action failed before writing one (A-1105)."
            exit 0
          fi

          # The log is an array of SDK stream messages; the last `type: result`
          # record carries the outcome. Tolerate a partial/!array write.
          summary=$(jq -r '
            (if type == "array" then . else [.] end)
            | map(select(type == "object" and .type == "result"))
            | last
            | if . == null then
                "no result record in the execution log"
              else
                "subtype=\(.subtype // "?") is_error=\(.is_error // "?") num_turns=\(.num_turns // "?") total_cost_usd=\(.total_cost_usd // "?")\nmessage: \(.result // .error // "(no message field)")"
              end
          ' "$file" 2>/dev/null | head -c 2000)

          if [ -z "$summary" ]; then
            echo "::warning::Claude execution log at '${file}' was unparseable JSON (A-1105)."
            exit 0
          fi

          echo "::group::Claude execution result"
          printf '%s\n' "$summary"
          echo "::endgroup::"

          # Annotations are single-line, and the runner parses `%`, CR and LF in a
          # workflow command's message as syntax — an unescaped `%` in an error
          # string (a rate-limit "100%", a percent-encoded URL) would corrupt the
          # annotation. Escape in this order: `%` FIRST (otherwise it re-escapes
          # the `%` of the %0D/%0A we add next), then CR, then fold LF to %0A.
          printf '::error::Claude review failed — %s\n' \
            "$(printf '%s' "$summary" | awk 'BEGIN{ORS="%0A"} { gsub(/%/, "%25"); gsub(/\r/, "%0D"); print }')"
